<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    {% include 'layouts/header.html' %}

    {% if messages %}
    <!-- Toast Container -->
    <div class="fixed top-20 right-5 z-50 flex flex-col gap-3 w-full max-w-sm">
        {% for message in messages %}
        <!-- Toast Message Item -->
        <div id="toast-{{ forloop.counter }}" class="flex items-center w-full p-4 text-gray-500 bg-white rounded-lg shadow-lg border border-gray-100 
         {% if message.tags == 'success' %} text-green-600 bg-green-50 border-green-200
         {% elif message.tags == 'error' or message.tags == 'danger' %} text-red-600 bg-red-50 border-red-200
         {% elif message.tags == 'warning' %} text-yellow-600 bg-yellow-50 border-yellow-200
         {% else %} text-blue-600 bg-blue-50 border-blue-200 {% endif %}" role="alert">

            <!-- Icon (Message အမျိုးအစားအလိုက်) -->
            <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg 
            {% if message.tags == 'success' %} bg-green-100 text-green-500
            {% elif message.tags == 'error' or message.tags == 'danger' %} bg-red-100 text-red-500
            {% elif message.tags == 'warning' %} bg-yellow-100 text-yellow-500
            {% else %} bg-blue-100 text-blue-500 {% endif %}">
                <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                    viewBox="0 0 20 20">
                    <path
                        d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z" />
                </svg>
            </div>

            <!-- Text Body -->
            <div class="ms-3 text-sm font-normal">{{ message }}</div>

            <!-- Close Button -->
            <button type="button"
                class="ms-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8"
                onclick="this.parentElement.style.display='none'" aria-label="Close">
                <span class="sr-only">Close</span>
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                </svg>
            </button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block body %}{% endblock %}
    {% include 'layouts/footer.html' %}
</body>

</html>
