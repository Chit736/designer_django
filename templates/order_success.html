{% extends 'layouts/base.html' %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg text-center border border-gray-100">
        <!-- Success Icon -->
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-6">
            <svg class="h-8 w-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        
        <h2 class="text-2xl font-bold text-gray-900 mb-2">အော်ဒါ တင်ခြင်း အောင်မြင်ပါတယ်!</h2>
        <p class="text-gray-600 mb-6">သင့်အော်ဒါ နံပါတ်မှာ <span class="font-bold text-gray-900">#{{ order.id }}</span> ဖြစ်ပါတယ်။</p>
        
        <div class="bg-gray-50 rounded-lg p-4 mb-6 text-left">
            <p class="text-sm text-gray-600">စုစုပေါင်း ကျသင့်ငွေ: <span class="font-bold text-green-600">{{ order.total_price }} $</span></p>
            <p class="text-sm text-gray-600 mt-1">ပို့ဆောင်ရမည့်လိပ်စာ: {{ order.address }}</p>
        </div>

        <a href="{% url 'index' %}" class="inline-block w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-300">
            ပင်မစာမျက်နှာသို့ ပြန်သွားမယ်
        </a>
    </div>
</div>
{% endblock %}
