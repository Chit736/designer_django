{% extends 'layouts/base.html' %}

{% block body %}
<div class="bg-gray-100 flex items-center justify-center min-h-screen py-10">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-lg">
        
        <!-- Header -->
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Create New Category</h2>
            <p class="text-sm text-green-500 mt-1">Fill in the details below to add a new category.</p>
        </div>

        <!-- Form -->
        <form method="post" action="">
            {% csrf_token %}
            
            <!-- Category Name -->
            <div class="mb-4">
                <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Category Name <span class="text-red-500">*</span></label>
                <input type="text" id="name" name="name" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                    placeholder="e.g. Electronics, Fashion">
            </div>

            <!-- Slug -->
            <div class="mb-4">
                <label for="slug" class="block text-gray-700 text-sm font-bold mb-2">Slug</label>
                <input type="text" id="slug" name="slug"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                    placeholder="e.g. electronics, fashion (Leave blank to auto-generate)">
                <p class="text-xs text-gray-500 mt-1">URL-friendly version of the name.</p>
            </div>

            <!-- Description -->
            <div class="mb-4">
                <label for="description" class="block text-gray-700 text-sm font-bold mb-2">Description</label>
                <textarea id="description" name="description" rows="4"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                    placeholder="Write a short description about this category..."></textarea>
            </div>

            <!-- Status (Checkbox) -->
            <div class="mb-6 flex items-center">
                <input type="checkbox" id="is_active" name="is_active" checked
                    class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2">
                <label for="is_active" class="ml-2 block text-sm text-gray-700 font-medium">
                    Active Status
                </label>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-between mt-8">
                <a href="{% url 'category_list' %}" class="text-gray-600 hover:text-gray-800 text-sm font-semibold transition duration-200">
                    &larr; Back to List
                </a>
                <button type="submit"
                    class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-300 shadow-md">
                    Save Category
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
