{% extends 'layouts/base.html' %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-gray-100">
        
        <!-- Header -->
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Email Verification
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                We've sent an 8-digit code to your email. Please enter it below.
            </p>
        </div>

        <!-- Form -->
        <form class="mt-8 space-y-6" method="post">
            {% csrf_token %}
            
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="otp" class="sr-only">Enter your OTP</label>
                    <input id="otp" name="otp" type="text" required 
                        class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm text-center tracking-widest font-mono text-lg" 
                        placeholder="00000000" maxlength="8">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-300">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <!-- Lock Icon (သို့) Check Icon -->
                        <svg class="h-5 w-5 text-green-500 group-hover:text-green-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                        </svg>
                    </span>
                    Verify OTP
                </button>
            </div>
        </form>
        
        <!-- Back to Register Link -->
        <div class="text-center mt-4">
            <a href="{% url 'register' %}" class="text-sm font-medium text-green-600 hover:text-green-500 transition duration-200">
                Didn't receive a code? Try again
            </a>
        </div>
    </div>
</div>
{% endblock %}
