{% extends 'layouts/base.html' %}

{% block body %}


<div class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-green-500 mb-6">Login Account</h2>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="username" class="block text-gray-400 text-sm font-bold mb-2">Username</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Enter your username">
            </div>

            <div class="mb-4">
                <label for="password" class="block text-gray-400 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Enter your password">
            </div>

            <button type="submit"
                class="w-full bg-green-500 hover:bg-green-400 text-white font-bold py-2 px-4 rounded-md">
                Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
