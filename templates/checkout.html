{% extends 'layouts/base.html' %}

{% block body %}
<div class="max-w-4xl mx-auto px-4 py-10">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Checkout</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- ဘယ်ဘက် - အချက်အလက်ဖြည့်တဲ့ Form -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
            <h3 class="text-lg font-bold text-gray-800 mb-4">ပို့ဆောင်ရန် အချက်အလက်</h3>
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">အမည် အပြည့်အစုံ</label>
                    <input type="text" name="full_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ဖုန်းနံပါတ်</label>
                    <input type="text" name="phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">နေရပ်လိပ်စာ</label>
                    <textarea name="address" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-300">
                    အော်ဒါ တင်မယ် (Total: {{ total_price }} $)
                </button>
            </form>
        </div>

        <!-- ညာဘက် - အော်ဒါ အနှစ်ချုပ် -->
        <div class="bg-gray-50 p-6 rounded-xl shadow-md border border-gray-200 h-fit">
            <h3 class="text-lg font-bold text-gray-800 mb-4">အော်ဒါ အနှစ်ချုပ်</h3>
            <ul class="divide-y divide-gray-200 mb-4">
                {% for item in products %}
                <li class="py-3 flex justify-between">
                    <span class="text-gray-700">{{ item.title }}</span>
                    <span class="font-medium text-gray-900">{{ item.price }} $</span>
                </li>
                {% endfor %}
            </ul>
            <div class="border-t border-gray-300 pt-4 flex justify-between font-bold text-lg">
                <span>စုစုပေါင်း</span>
                <span class="text-green-600">{{ total_price }} $</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
