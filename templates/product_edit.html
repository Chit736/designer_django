{% extends 'layouts/base.html' %}

{% block body %}

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl border border-blue-100 mx-auto mt-10">

    <!-- Header -->
    <div class="mb-8 border-b pb-4">
        <h2 class="text-2xl font-bold text-blue-800">Edit Product</h2>
        <p class="text-sm text-blue-500 mt-1">Update the information below to edit your product.</p>
    </div>

    <form method="post" action="" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Product Name -->
            <div class="md:col-span-2">
                <label for="title" class="block text-blue-800 text-sm font-bold mb-2">Product Name <span class="text-red-500">*</span></label>
                <!-- value မှာ product.title ထည့်ထားတယ် -->
                <input type="text" id="title" name="title" value="{{products.title}}" required
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                    placeholder="e.g. iPhone 15 Pro Max">
            </div>

            <!-- Category Dropdown -->
            <div>
                <label for="category" class="block text-blue-800 text-sm font-bold mb-2">Category <span class="text-red-500">*</span></label>
                <!-- select tag မှာ value မထည့်ရပါဘူး၊ အောက်က option မှာ selected လုပ်ရပါမယ် -->
                <select id="category" name="category" required
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 bg-white">
                    <option value="" disabled>Select a category</option>

                    {% for cat in categories %}
                        <!-- လက်ရှိ Product ရဲ့ Category နဲ့ ကိုက်ညီရင် selected ဖြစ်နေမယ် -->
                        <option value="{{ cat.id }}" {% if product.category.id == cat.id %} selected {% endif %}>
                            {{ cat.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Price -->
            <div>
                <label for="price" class="block text-blue-800 text-sm font-bold mb-2">Price ($) <span class="text-red-500">*</span></label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">$</span>
                    <!-- value မှာ product.price ထည့်ထားတယ် -->
                    <input type="number" id="price" name="price" value="{{products.price}}" required step="0.01"
                        class="w-full pl-8 pr-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                        placeholder="0.00">
                </div>
            </div>

            <!-- Stock Quantity -->
            <div>
                <label for="qty" class="block text-blue-800 text-sm font-bold mb-2">Stock Quantity <span class="text-red-500">*</span></label>
                <!-- value မှာ product.qty ထည့်ထားတယ် -->
                <input type="number" id="qty" name="qty" value="{{products.qty}}" required
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                    placeholder="e.g. 50">
            </div>

            <!-- Product Image Upload -->
            <div>
                <label class="block text-blue-800 text-sm font-bold mb-2">Product Image</label>
                <div class="flex items-center justify-center w-full">
                    <label for="image-upload"
                        class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition duration-200 relative overflow-hidden">
                        
                        <!-- ပုံအဟောင်း ရှိမရှိ စစ်မယ် -->
                        {% if products.image %}
                            <!-- ပုံအဟောင်း ရှိရင် အဲဒီပုံကို ပြထားမယ် (placeholder ကို ဖျောက်ထားမယ်) -->
                            <img id="image-preview" src="{{products.image.url}}" alt="{{ products.title }}" class="w-full h-full object-cover rounded-lg">
                            <div id="upload-placeholder" class="hidden flex-col items-center justify-center pt-5 pb-6">
                        {% else %}
                            <!-- ပုံမရှိရင် မူလအိုင်ကွန်လေးကို ပြမယ် -->
                            <img id="image-preview" src="" alt="Image Preview" class="hidden w-full h-full object-cover rounded-lg">
                            <div id="upload-placeholder" class="flex flex-col items-center justify-center pt-5 pb-6">
                        {% endif %}
                                <svg class="w-8 h-8 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                </svg>
                                <p class="mb-1 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                                <p class="text-xs text-gray-500">PNG, JPG or JPEG (MAX. 800x400px)</p>
                            </div>
                        
                        <input id="image-upload" name="image" type="file" class="hidden" accept="image/*" onchange="previewImage(event)" />
                    </label>
                </div>
            </div>

            <!-- Description -->
            <div class="md:col-span-2">
                <label for="description" class="block text-blue-800 text-sm font-bold mb-2">Description</label>
                <!-- textarea ထဲမှာ product.description ကို ထည့်ထားတယ် -->
                <textarea id="description" name="description" rows="4"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                    placeholder="Write a detailed description about the product...">{{ product.description }}</textarea>
            </div>

        </div>

        <!-- Action Buttons -->
        <div class="flex items-center justify-end mt-8 pt-6 border-t border-gray-100 gap-4">
            <a href="{% url 'product_list' %}" class="text-blue-800 hover:text-gray-800 font-semibold px-4 py-2 rounded-lg transition duration-200">
                Cancel
            </a>
            <button type="submit"
                class="bg-green-500 hover:bg-blue-700 text-white font-bold py-2.5 px-8 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-300 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Update Product
            </button>
        </div>
    </form>
</div>

<script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('image-preview');
        const placeholder = document.getElementById('upload-placeholder');

        if (input.files && input.files[0]) {
            const reader = new FileReader();

            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                // placeholder က hidden ဖြစ်နေရင် flex ပြန်ဖြစ်အောင် လုပ်ဖို့ မလိုပါဘူး၊ ဖျောက်ထားရုံပါပဲ
                placeholder.classList.add('hidden');
            }

            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
